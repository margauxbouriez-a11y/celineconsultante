.navbtn:hover{background:#1d3352;color:#fff}
.navbtn.on{background:#253c5b;color:#fff;box-shadow:inset 3px 0 0 #c5a45f}
.navbtn.add{border:1px dashed #3a5070;color:#e0c783;margin-top:6px}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.main{flex:999 1 560px;min-width:0;padding:28px 32px 48px}
.stack{display:flex;flex-direction:column;gap:20px}
.card{background:#fff;border:1px solid #dce3eb;border-radius:10px;padding:20px}

.kpi-v{font:400 30px/1.1 Georgia,serif;color:#142640;margin-top:6px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5d6a7e}
.muted{color:#526176}
.small{font-size:12.5px}
.h1{font:400 28px/1.2 Georgia,serif;margin:0 0 4px}
.h2{font-size:16px;font-weight:700;margin:0 0 12px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#5d6a7e;padding:10px 12px;border-bottom:1px solid #dce3eb;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #edf1f6;vertical-align:top}
tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:#e1f0e6;color:#1d5533}

.btn.ghost{background:#fff;color:#142640;border-color:#c3ccd8}

.pill.on{background:#142640;border-color:#142640;color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid #dce3eb}
.tab{min-height:44px;padding:0 16px;border:0;border-bottom:2px solid transparent;background:transparent;color:#526176;font:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:-1px}
.tab.on{color:#142640;border-bottom-color:#c5a45f}
.crumb{background:none;border:0;padding:0;color:#8c6725;font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.alert{display:flex;flex-wrap:wrap;gap:10px 24px;padding:14px 18px;border-radius:10px;background:#fbf5e6;border:1px solid #ecd9a8;color:#5a3c06;font-size:13.5px}

.prod:hover{border-color:#c5a45f}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
.span2{grid-column:span 2;min-width:0}
@media (max-width:900px){.span2{grid-column:auto}}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:#3d4a5e}
.field input,.field select,.inp{min-height:40px;padding:0 10px;border:1px solid #c3ccd8;border-radius:8px;font:inherit;font-size:14px;color:#142640;background:#fff}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.newcount{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#c62828;color:#fff;font-size:12px;font-weight:700}

.law:last-child{border-bottom:0}
.law-title{font-weight:700;font-size:15px;color:#142640}

        '<label class="field" style="flex:1 1 140px">Gravité<select id="ev-grav"><option>Non grave</option><option>Grave</option><option>Fatal</option></select></label>' +
        '<label class="field" style="flex:1 1 140px">Source<select id="ev-src"><option>Client</option><option>Patient</option><option>Professionnel de santé</option><option>Essai</option></select></label>' +
        '<button class="btn" data-click="' + on(function () {
          var term = document.getElementById('ev-term').value.trim(); if (!term) return;
          set({ added: [{ pid: p.id, date: TODAY, term: term, grav: document.getElementById('ev-grav').value, cases: '1', source: document.getElementById('ev-src').value, lot: '—', status: 'Nouveau', action: '—' }].concat(S.added) });
        }) + '">Ajouter</button></div>' +
        '<p class="muted" style="font-size:12px;margin:10px 0 0">Un effet grave déclenche une alerte immédiate. La déclaration officielle (EudraVigilance, ANSM) reste à faire par l’entreprise.</p></section>';
    } else {
      h += '<div class="grid3"><section class="card" style="min-width:0"><h2 class="h2">Fournisseurs</h2><div class="scroll"><table><thead><tr><th>Nom</th><th>Pays</th><th>Rôle</th><th>Audit</th></tr></thead><tbody>' +
        D.suppliers.map(function (s) { return '<tr><td style="font-weight:600">' + esc(s.name) + '</td><td>' + esc(s.country) + '</td><td>' + esc(s.role) + '</td><td>' + badge(s.audit) + '</td></tr>'; }).join('') +
        '</tbody></table></div></section><section class="card" style="min-width:0"><h2 class="h2">Acheteurs</h2><div class="scroll"><table><thead><tr><th>Nom</th><th>Pays</th><th>Type</th><th>Contrat</th></tr></thead><tbody>' +
        D.buyers.map(function (b) { return '<tr><td style="font-weight:600">' + esc(b.name) + '</td><td>' + esc(b.country) + '</td><td>' + esc(b.role) + '</td><td>' + esc(b.contract) + '</td></tr>'; }).join('') +
        '</tbody></table></div></section></div><div style="margin-top:14px"><button class="btn ghost">+ Ajouter un partenaire</button></div>';
    }
    return '<div>' + h + '</div>';
  }

  function viewCrm() {
    var shown = S.contacts.filter(function (c) { return S.crmFilter === 'Tous' || c.status === S.crmFilter; });
    return '<div class="stack"><div><h1 class="h1">Contacts</h1><p class="muted" style="margin:0">Clients et prospects. « Étape suivante » fait avancer le contact dans le démarchage.</p></div>' +
      '<div class="pills">' + ['Tous'].concat(STEPS).map(function (f) { return '<button class="pill' + (S.crmFilter === f ? ' on' : '') + '" data-click="' + on(function () { set({ crmFilter: f }); }) + '">' + f + '</button>'; }).join('') + '</div>' +
      '<div class="card scroll" style="padding:8px"><table><thead><tr><th>Nom</th><th>Fonction</th><th>Entreprise</th><th>Statut</th><th>Dernier échange</th><th>Prochaine action</th><th></th></tr></thead><tbody>' +
      shown.map(function (c) {
        return '<tr><td style="font-weight:600">' + esc(c.name) + '</td><td>' + esc(c.role) + '</td><td>' + esc(c.company) + '</td><td>' + badge(c.status) + '</td><td>' + esc(c.last) + '</td><td>' + esc(c.next) + '</td>' +
          '<td style="text-align:right"><button class="btn ghost sm" data-click="' + on(function () {
            var i = STEPS.indexOf(c.status); var nx = i < 0 || i >= STEPS.length - 1 ? c.status : STEPS[i + 1];
            set({ contacts: S.contacts.map(function (x) { return x.id === c.id ? Object.assign({}, x, { status: nx, last: TODAY + ' · mise à jour' }) : x; }) });
          }) + '">Étape suivante</button></td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  function viewFees() {
    var f = S.invForm;
    return '<div class="stack"><div><h1 class="h1">Honoraires</h1><p class="muted" style="margin:0">Saisissez vos factures ; les totaux par entreprise se recalculent aussitôt.</p></div>' +
      '<section class="card"><h2 class="h2">Ajouter une facture</h2><div class="row">' +
      '<label class="field" style="flex:2 1 200px">Entreprise<select id="inv-cid">' + S.companies.map(function (c) { return '<option value="' + c.id + '"' + (c.id === f.cid ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</select></label>' +
      '<label class="field" style="flex:1 1 140px">Numéro<input type="text" id="inv-num" placeholder="FAC-2026-043"></label>' +
      '<label class="field" style="flex:1 1 120px">Montant HT (€)<input type="number" min="0" id="inv-ht" placeholder="2400"></label>' +
      '<label class="field" style="flex:1 1 130px">Statut<select id="inv-st"><option>Payée</option><option>En attente</option></select></label>' +
      '<button class="btn" data-click="' + on(function () {
        var cid = document.getElementById('inv-cid').value, num = document.getElementById('inv-num').value.trim();
        var ht = Number(String(document.getElementById('inv-ht').value).replace(',', '.'));
        if (!num || !(ht > 0)) { set({ invError: true, invForm: { cid: cid } }); return; }
        set({ invoices: [{ num: num, date: TODAY, cid: cid, ht: ht, status: document.getElementById('inv-st').value }].concat(S.invoices), invError: false, invForm: { cid: cid } });
      }) + '">Ajouter</button></div>' +
      (S.invError ? '<p class="err">Indiquez un numéro et un montant.</p>' : '') + '</section>' +
      '<div class="kpis">' + S.companies.map(function (c) { return '<div class="card"><div class="lbl">' + esc(c.name) + '</div><div class="kpi-v">' + eur(sumBy(c.id, 'Payée')) + '</div><div class="muted small">' + eur(sumBy(c.id, 'En attente')) + ' en attente</div></div>'; }).join('') + '</div>' +
      '<div class="card scroll" style="padding:8px"><table><thead><tr><th>Facture</th><th>Date</th><th>Entreprise</th><th>HT</th><th>TTC</th><th>Statut</th></tr></thead><tbody>' +
      S.invoices.map(function (i) { return '<tr><td style="font-weight:600">' + esc(i.num) + '</td><td>' + i.date + '</td><td>' + esc(companyOf(i.cid).name) + '</td><td>' + eur(i.ht) + '</td><td>' + eur(i.ht * 1.2) + '</td><td>' + badge(i.status) + '</td></tr>'; }).join('') +
      '</tbody></table></div></div>';
  }

  function viewAdd() {
    var f = S.form;
    function inp(id, label, ph, type, flex) {
      return '<label class="field"' + (flex ? ' style="flex:1 1 200px"' : '') + '>' + label + '<input type="' + (type || 'text') + '" id="f-' + id + '" value="' + esc(f[id]) + '" placeholder="' + ph + '"></label>';
    }
    return '<div class="stack" style="max-width:720px"><div><h1 class="h1">Ajouter une entreprise</h1><p class="muted" style="margin:0">Elle apparaîtra dans vos onglets à gauche.</p></div>' +
      '<section class="card stack" style="gap:16px">' + inp('name', 'Nom de l’entreprise', 'ex. Laboratoires Exemple') +
      '<div class="row">' + inp('city', 'Ville', 'ex. Toulouse', 'text', 1) + inp('siren', 'SIREN', '9 chiffres', 'text', 1) + '</div>' +
      inp('sector', 'Secteur précis', 'ex. Biosimilaires en oncologie') +
      '<div class="row">' + inp('contact', 'Contact principal', 'Prénom Nom', 'text', 1) + inp('email', 'E-mail du contact', 'nom@entreprise.fr', 'email', 1) + '</div>' +
      (S.formError ? '<p class="err" style="margin:0">Indiquez au moins le nom de l’entreprise.</p>' : '') +
      '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-click="' + on(function () {
        var v = {}; ['name', 'city', 'siren', 'sector', 'contact', 'email'].forEach(function (k) { v[k] = document.getElementById('f-' + k).value.trim(); });
        if (!v.name) { set({ form: v, formError: true }); return; }
        var id = 'c' + Date.now();
        var watch = {}; for (var k in S.watch) watch[k] = S.watch[k];
        watch[id] = { sector: v.sector, topics: [], keywords: [], sources: SOURCES.slice(), lastRun: 'pas encore lancée' };
        set({
          companies: S.companies.concat([{ id: id, name: v.name, city: v.city || '—' }]),
          watch: watch,
          contacts: v.contact ? S.contacts.concat([{ id: 'k' + id, name: v.contact, role: '—', company: v.name, status: 'Client', last: TODAY + ' · création', next: '—' }]) : S.contacts,
          view: 'company', companyId: id, sub: 'watch', prodFilter: 'Tous',
          form: { name: '', city: '', siren: '', sector: '', contact: '', email: '' }, formError: false
        });
      }) + '">Créer l’entreprise</button><button class="btn ghost" data-click="' + on(function () { set({ view: 'dash' }); }) + '">Annuler</button></div></section></div>';
  }

  // ---------- Rendu ----------
  function render() {
    H = [];
    document.getElementById('side').innerHTML = renderSide();
    var v = S.view;
    document.getElementById('main').innerHTML =
      v === 'clients' ? viewClients() :
      v === 'company' ? viewCompany() :
      v === 'product' ? viewProduct() :
      v === 'crm' ? viewCrm() :
      v === 'fees' ? viewFees() :
      v === 'add' ? viewAdd() : viewDash();
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-click]');
    if (el && document.body.contains(el) && H[+el.getAttribute('data-click')]) { H[+el.getAttribute('data-click')](e); }
  });
  document.addEventListener('change', function (e) {
    var el = e.target.closest('[data-change]');
    if (el && H[+el.getAttribute('data-change')]) { H[+el.getAttribute('data-change')](e); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'kw') { var b = e.target.nextElementSibling; if (b) b.click(); }
  });

  render();
})();
</script>
</body>
</html>
